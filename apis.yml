name: Blixt
description: 'BL!XT (Blixt) is a Swedish deep-tech company building intelligent, programmable
  power infrastructure that turns electrical distribution from analog systems into digitally
  controlled, software-defined platforms. Its products include ZERO, a solid-state current-control
  switchgear for circuit-level protection, monitoring, and automation; X-VERTER, a software-defined
  voltage conversion system with integrated energy storage; and THE ZONE, an AI-driven software
  intelligence layer that coordinates connected distribution devices for real-time analysis, failure
  prediction, and load balancing. BL!XT serves data centers, industrial manufacturing, maritime
  vessels, grid providers, and defense. Headquartered in Kista, Sweden and backed by Union Square
  Ventures. As of this enrichment pass the company publishes no public API or developer surface.'
